<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bản đồ 3D Đà Nẵng</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css"
      crossorigin="anonymous"
    />
    <script
      src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
    <script
      src="https://unpkg.com/@protomaps/basemaps@5/dist/basemaps.js"
      crossorigin="anonymous"
    ></script>
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #dce8ef;
        font-family: Inter, system-ui, sans-serif;
      }

      #status {
        position: absolute;
        z-index: 2;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 12px 16px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.94);
        color: #41516a;
        box-shadow: 0 10px 30px rgba(18, 33, 58, 0.16);
        font-size: 14px;
        text-align: center;
        pointer-events: none;
      }

      #status[hidden] {
        display: none;
      }

      .stop-marker {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 3px solid white;
        border-radius: 50% 50% 50% 10%;
        background: #246bfd;
        color: white;
        box-shadow: 0 5px 14px rgba(22, 32, 51, 0.32);
        font-size: 11px;
        font-weight: 900;
        transform: rotate(-45deg);
      }

      .stop-marker span {
        transform: rotate(45deg);
      }

      .stop-marker.origin {
        background: #ff625f;
      }

      .car-marker {
        position: relative;
        width: 22px;
        height: 42px;
        border: 2px solid rgba(255, 255, 255, 0.95);
        border-radius: 8px 8px 6px 6px;
        background: linear-gradient(90deg, #1662dd, #4c9bff 48%, #1760d9);
        box-shadow: 0 5px 13px rgba(13, 42, 90, 0.45);
        transform-origin: 50% 50%;
      }

      .car-marker::before {
        content: "";
        position: absolute;
        top: 7px;
        left: 3px;
        right: 3px;
        height: 9px;
        border-radius: 3px;
        background: linear-gradient(#c5ebff, #5791be);
        box-shadow: 0 17px 0 #96c8e9;
      }

      .car-marker::after {
        content: "";
        position: absolute;
        top: -2px;
        left: 3px;
        width: 4px;
        height: 3px;
        border-radius: 2px;
        background: #fff7bb;
        box-shadow: 10px 0 0 #fff7bb;
      }

      .maplibregl-ctrl-bottom-left {
        bottom: 2px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="status">Đang mở bản đồ Đà Nẵng…</div>

    <script>
      const statusElement = document.getElementById("status");
      let map;
      let routeCoordinates = [];
      let stopMarkers = [];
      let carMarker;
      let animationId;
      let animationStartedAt = 0;
      let lastCameraUpdate = 0;
      let mapReady = false;
      let pendingTrip;
      const animationDuration = 26000;

      function showError(message) {
        statusElement.textContent = message;
        statusElement.style.color = "#c43d4b";
      }

      function add3DBuildings(map) {
        if (map.getLayer("davel-3d-buildings")) return;

        const layers = map.getStyle().layers || [];
        const firstLabel = layers.find(
          (layer) =>
            layer.type === "symbol" &&
            layer.layout &&
            layer.layout["text-field"],
        );

        map.addLayer(
          {
            id: "davel-3d-buildings",
            source: "protomaps",
            "source-layer": "buildings",
            type: "fill-extrusion",
            minzoom: 14,
            filter: [
              "any",
              ["==", ["get", "kind"], "building"],
              ["==", ["get", "kind"], "building_part"],
            ],
            paint: {
              "fill-extrusion-color": [
                "interpolate",
                ["linear"],
                ["coalesce", ["get", "height"], 8],
                0,
                "#d8dee6",
                45,
                "#aab8c8",
                120,
                "#8295aa",
              ],
              "fill-extrusion-height": [
                "interpolate",
                ["linear"],
                ["zoom"],
                14,
                0,
                14.4,
                ["coalesce", ["get", "height"], 8],
              ],
              "fill-extrusion-base": [
                "interpolate",
                ["linear"],
                ["zoom"],
                14,
                0,
                14.4,
                ["coalesce", ["get", "min_height"], 0],
              ],
              "fill-extrusion-opacity": 0.88,
            },
          },
          firstLabel ? firstLabel.id : undefined,
        );
      }

      function parseInitialTrip() {
        const params = new URLSearchParams(window.location.search);
        try {
          return {
            stops: JSON.parse(params.get("stops") || "[]"),
            autoPlay: params.get("autoplay") === "true",
          };
        } catch {
          return { stops: [], autoPlay: false };
        }
      }

      async function requestOsrmRoute(stops) {
        const coordinates = stops
          .map((stop) => `${stop.longitude},${stop.latitude}`)
          .join(";");
        const query = new URLSearchParams({
          overview: "full",
          geometries: "geojson",
          steps: "false",
        });
        const response = await fetch(
          `https://router.project-osrm.org/route/v1/driving/${coordinates}?${query.toString()}`,
        );
        const data = await response.json().catch(() => null);
        if (!response.ok || data?.code !== "Ok" || !data.routes?.length) {
          throw new Error(data?.message || data?.code || `HTTP ${response.status}`);
        }
        return data.routes[0].geometry.coordinates;
      }

      function drawRoute(coordinates, isFallback = false) {
        const data = {
          type: "Feature",
          properties: {},
          geometry: { type: "LineString", coordinates },
        };

        if (map.getSource("demo-route")) {
          map.getSource("demo-route").setData(data);
          map.setPaintProperty(
            "demo-route-line",
            "line-color",
            isFallback ? "#f09b32" : "#246bfd",
          );
          return;
        }

        map.addSource("demo-route", { type: "geojson", data });
        map.addLayer({
          id: "demo-route-casing",
          type: "line",
          source: "demo-route",
          layout: { "line-join": "round", "line-cap": "round" },
          paint: { "line-color": "rgba(255,255,255,.94)", "line-width": 10 },
        });
        map.addLayer({
          id: "demo-route-line",
          type: "line",
          source: "demo-route",
          layout: { "line-join": "round", "line-cap": "round" },
          paint: {
            "line-color": isFallback ? "#f09b32" : "#246bfd",
            "line-width": 6,
            "line-opacity": 0.96,
          },
        });
      }

      function showStops(stops) {
        stopMarkers.forEach((marker) => marker.remove());
        stopMarkers = stops.map((stop, index) => {
          const element = document.createElement("div");
          element.className = `stop-marker ${index === 0 ? "origin" : ""}`;
          const label = document.createElement("span");
          label.textContent = index === 0 ? "A" : String(index);
          element.append(label);
          element.title = stop.title || `Điểm ${index + 1}`;
          return new maplibregl.Marker({ element, anchor: "bottom" })
            .setLngLat([stop.longitude, stop.latitude])
            .addTo(map);
        });
      }

      function fitRoute(coordinates) {
        const bounds = coordinates.reduce(
          (current, coordinate) => current.extend(coordinate),
          new maplibregl.LngLatBounds(coordinates[0], coordinates[0]),
        );
        map.fitBounds(bounds, {
          padding: { top: 110, right: 80, bottom: 150, left: 80 },
          pitch: 58,
          bearing: -22,
          maxZoom: 15.8,
          duration: 1000,
        });
      }

      function createCar(coordinate) {
        if (!carMarker) {
          const element = document.createElement("div");
          element.className = "car-marker";
          carMarker = new maplibregl.Marker({
            element,
            rotationAlignment: "map",
            pitchAlignment: "map",
          })
            .setLngLat(coordinate)
            .addTo(map);
        } else {
          carMarker.setLngLat(coordinate);
        }
      }

      function haversine(a, b) {
        const rad = Math.PI / 180;
        const dLat = (b[1] - a[1]) * rad;
        const dLng = (b[0] - a[0]) * rad;
        const lat1 = a[1] * rad;
        const lat2 = b[1] * rad;
        const value =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(lat1) *
            Math.cos(lat2) *
            Math.sin(dLng / 2) ** 2;
        return (
          6371000 *
          2 *
          Math.atan2(Math.sqrt(value), Math.sqrt(1 - value))
        );
      }

      function bearing(a, b) {
        const rad = Math.PI / 180;
        const y =
          Math.sin((b[0] - a[0]) * rad) * Math.cos(b[1] * rad);
        const x =
          Math.cos(a[1] * rad) * Math.sin(b[1] * rad) -
          Math.sin(a[1] * rad) *
            Math.cos(b[1] * rad) *
            Math.cos((b[0] - a[0]) * rad);
        return (Math.atan2(y, x) / rad + 360) % 360;
      }

      function routeLengths(coordinates) {
        const lengths = [0];
        for (let index = 1; index < coordinates.length; index++) {
          lengths.push(
            lengths[index - 1] +
              haversine(coordinates[index - 1], coordinates[index]),
          );
        }
        return lengths;
      }

      function pointAtProgress(coordinates, lengths, progress) {
        const target = progress * lengths[lengths.length - 1];
        let index = 1;
        while (index < lengths.length && lengths[index] < target) index++;
        if (index >= lengths.length) {
          return {
            point: coordinates.at(-1),
            angle: bearing(coordinates.at(-2), coordinates.at(-1)),
          };
        }
        const segmentLength = lengths[index] - lengths[index - 1] || 1;
        const ratio = (target - lengths[index - 1]) / segmentLength;
        const from = coordinates[index - 1];
        const to = coordinates[index];
        return {
          point: [
            from[0] + (to[0] - from[0]) * ratio,
            from[1] + (to[1] - from[1]) * ratio,
          ],
          angle: bearing(from, to),
        };
      }

      function playRoute() {
        if (routeCoordinates.length < 2) return;
        cancelAnimationFrame(animationId);
        createCar(routeCoordinates[0]);
        animationStartedAt = performance.now();
        lastCameraUpdate = 0;
        const lengths = routeLengths(routeCoordinates);

        function frame(now) {
          const progress = Math.min(
            1,
            (now - animationStartedAt) / animationDuration,
          );
          const current = pointAtProgress(routeCoordinates, lengths, progress);
          carMarker.setLngLat(current.point).setRotation(current.angle);

          if (now - lastCameraUpdate > 450) {
            map.easeTo({ center: current.point, duration: 500 });
            lastCameraUpdate = now;
          }

          if (progress < 1) animationId = requestAnimationFrame(frame);
        }

        animationId = requestAnimationFrame(frame);
      }

      async function renderTrip(stops, autoPlay = false) {
        if (stops.length < 2) return;
        if (!mapReady) {
          pendingTrip = { stops, autoPlay };
          return;
        }
        pendingTrip = undefined;
        cancelAnimationFrame(animationId);
        showStops(stops);
        statusElement.hidden = false;
        statusElement.style.color = "#41516a";
        statusElement.textContent = "Đang tìm tuyến đường thực tế…";

        let isFallback = false;
        try {
          routeCoordinates = await requestOsrmRoute(stops);
        } catch (error) {
          console.warn("OSRM unavailable, using demo geometry", error);
          routeCoordinates = stops.map((stop) => [stop.longitude, stop.latitude]);
          isFallback = true;
        }

        drawRoute(routeCoordinates, isFallback);
        createCar(routeCoordinates[0]);
        fitRoute(routeCoordinates);
        statusElement.hidden = true;
        if (autoPlay) setTimeout(playRoute, 1300);
      }

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin) return;
        try {
          const message =
            typeof event.data === "string" ? JSON.parse(event.data) : event.data;
          if (message?.type === "setRoute") {
            renderTrip(message.stops || [], Boolean(message.autoPlay));
          } else if (message?.type === "playRoute") {
            playRoute();
          }
        } catch (error) {
          console.error("Invalid Flutter map message", error);
        }
      });

      async function startMap() {
        try {
          const response = await fetch("data/danang.pmtiles");
          if (!response.ok) {
            throw new Error(`Không đọc được PMTiles (HTTP ${response.status})`);
          }

          const blob = await response.blob();
          const file = new File([blob], "danang.pmtiles", {
            type: "application/vnd.pmtiles",
          });
          const archive = new pmtiles.PMTiles(new pmtiles.FileSource(file));
          const protocol = new pmtiles.Protocol({ metadata: true });
          protocol.add(archive);
          maplibregl.addProtocol("pmtiles", protocol.tile);

          map = new maplibregl.Map({
            container: "map",
            center: [108.2215, 16.0722],
            zoom: 15.4,
            pitch: 62,
            bearing: -24,
            antialias: true,
            maxPitch: 80,
            style: {
              version: 8,
              glyphs:
                "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
              sprite:
                "https://protomaps.github.io/basemaps-assets/sprites/v4/light",
              sources: {
                protomaps: {
                  type: "vector",
                  url: "pmtiles://danang.pmtiles",
                  attribution:
                    '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                },
              },
              layers: basemaps.layers(
                "protomaps",
                basemaps.namedFlavor("light"),
                { lang: "vi" },
              ),
            },
          });

          map.addControl(
            new maplibregl.NavigationControl({ visualizePitch: true }),
            "bottom-right",
          );
          map.addControl(new maplibregl.FullscreenControl(), "bottom-right");

          map.on("load", () => {
            add3DBuildings(map);
            mapReady = true;
            statusElement.hidden = true;
            const initialTrip = parseInitialTrip();
            const trip = pendingTrip || initialTrip;
            if (trip.stops.length > 1) {
              renderTrip(trip.stops, trip.autoPlay);
            }
          });
          map.on("error", (event) => {
            console.error("MapLibre error", event.error || event);
          });
        } catch (error) {
          console.error(error);
          showError(`Không mở được bản đồ local: ${error.message}`);
        }
      }

      startMap();
    </script>
  </body>
</html>
